networks:
  docker_network:
    name: inception
    driver: bridge 


services:
  NGINX:
  #NOTE: Build
    build: NGINX/
    pull_policy: build
    image: nginx:inception

  #NOTE: Run
    container_name: NGINX
    env_file:
      - .env
    ports:
      - "443:443"
    networks:
        - docker_network
    volumes:
        - WP:/var/www/html
    depends_on:
      WordPress:
        condition: service_started
    secrets:
        - certificate
        - key
    restart: unless-stopped

  MariaDB:
    build: MariaDB/
    pull_policy: build
    image: mariadb:inception

    container_name: MariaDB
    env_file:
      - .env
    networks:
        - docker_network
    volumes:
        - DB:/var/lib/mysql
    secrets:
        - mariadb_root_password
        - mariadb_password
    restart: unless-stopped

  WordPress:
    build: WordPress/
    pull_policy: build
    image: wordpress:inception

    container_name: WordPress
    env_file:
      - .env
    depends_on:
      MariaDB:
        condition: service_healthy
# BONUS
      Redis:
        condition: service_healthy
# END OF BONUS
    networks:
        - docker_network
    volumes:
        - WP:/var/www/html
    secrets:
        - mariadb_root_password
        - mariadb_password
        - wp_admin_password
        - wp_user_password
    restart: unless-stopped

# BONUS

  FTP:
    build: FTP/
    pull_policy: build
    image: ftp:inception

    container_name: FTP
    ports:
      - "21:21"
      - "21100:21100" # plage passive PASV — doit correspondre à pasv_min/max_port dans vsftpd.conf
    networks:
      - docker_network
    volumes:
        - WP:/var/www/html
    secrets:
      - ftp_password
      - certificate
      - key
    restart: unless-stopped


  Redis:
    build: Redis/
    pull_policy: build
    image: redis:inception

    container_name: Redis
    networks:
      - docker_network
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  Portainer:
    build: Portainer/
    pull_policy: build
    image: portainer:inception

    container_name: Portainer
    ports:
      - "9443:9443"
    networks:
      - docker_network
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - portainer_admin_password
    restart: unless-stopped

  WebServ:
    build: WebServ/
    pull_policy: build
    image: webserv:inception

    container_name: WebServ
    networks:
        - docker_network
    # volumes:
    #   - ./WebServ/site:/var/www/html # bind mount direct — non named, invisible dans docker volume ls
    healthcheck:
      test: ["CMD", "curl", "-s", "--http1.1", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  Adminer:
    build: Adminer/
    pull_policy: build
    image: adminer:inception
    
    container_name: Adminer
    networks:
      - docker_network
    depends_on:
      - MariaDB
    restart: unless-stopped

# END OF BONUS

volumes:
# BONUS
  portainer_data:
    name: portainer_data
# END OF BONUS

  DB:
    name: DB
    driver: local
    driver_opts:
      type: none
      device: ${HOST_DATA_PATH}
      o: bind

  WP:
    name: WP
    driver: local
    driver_opts:
      type: none
      device: ${HOST_WP_PATH}
      o: bind

secrets:
  mariadb_root_password:
    file: ./mariadb_root_password.secret
  mariadb_password:
    file: ./mariadb_password.secret
  
  wp_admin_password:
    file: ./wp_admin_password.secret
  wp_user_password:
    file: ./wp_user_password.secret

  certificate:
    file: ./cert.pem.secret
  key:
    file: ./key.pem.secret

# BONUS
  portainer_admin_password:
    file: ./portainer_admin_password.secret
  ftp_password:
    file: ./ftp_password.secret
# END OF BONUS
