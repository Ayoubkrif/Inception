listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/empty

ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
rsa_cert_file=/etc/vsftpd/cert.pem
rsa_private_key_file=/etc/vsftpd/key.pem

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=192.168.56.10

seccomp_sandbox=NO

xferlog_enable=YES
vsftpd_log_file=/tmp/vsftpd.log
log_ftp_protocol=YES
